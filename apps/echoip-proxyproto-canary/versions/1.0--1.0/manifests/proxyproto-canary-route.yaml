apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echoip-proxyproto-canary
spec:
  parentRefs:
    - name: echoip-proxyproto-canary
      namespace: gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echoip-proxyproto-canary
          port: 8080
